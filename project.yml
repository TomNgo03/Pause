name: Pause
options:
  bundleIdPrefix: org.pauseproject
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Pause:
    type: application
    platform: iOS
    sources:
      - path: Pause
        excludes:
          - Resources/Pause.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pauseproject.app
        INFOPLIST_FILE: Pause/Resources/Info.plist
    dependencies: []
  PauseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PauseTests]
    dependencies:
      - target: Pause
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pauseproject.tests
