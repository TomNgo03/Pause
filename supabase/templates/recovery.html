<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:520px;margin:auto;color:#17182b">
  <h1 style="font-size:28px">Reset your Pause password</h1>
  <p>Enter this temporary code in Pause to choose a new password:</p>
  <p style="font-size:36px;font-weight:700;letter-spacing:8px;color:#4a40c7">{{ .Token }}</p>

  <p style="color:#6b6d7c;font-size:13px">Pause will never ask you to send this code to another person.</p>
</div>
